# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "nanoha-gunlance-mod"

[setup]
script = '''
# Link the worktree assets directory to the main project's shared assets.
set -eu

worktree_root="$(git rev-parse --show-toplevel)"
common_git_dir="$(git rev-parse --path-format=absolute --git-common-dir)"
main_root="$(dirname "$common_git_dir")"

assets_source="$main_root/assets"
assets_link="$worktree_root/assets"

# No setup is needed when running in the main project.
if [ "$assets_source" = "$assets_link" ]; then
  exit 0
fi

if [ ! -d "$assets_source" ]; then
  echo "Main project assets directory does not exist: $assets_source" >&2
  exit 1
fi

# Allow the script to run repeatedly.
if [ -L "$assets_link" ]; then
  if [ "$(readlink "$assets_link")" = "$assets_source" ]; then
    exit 0
  fi

  echo "Assets is already a symlink pointing elsewhere: $assets_link" >&2
  exit 1
fi

# Do not overwrite an existing directory or file.
if [ -e "$assets_link" ]; then
  echo "A non-symlink assets path already exists in the worktree: $assets_link" >&2
  exit 1
fi

ln -s "$assets_source" "$assets_link"
echo "Created: $assets_link -> $assets_source"'''
